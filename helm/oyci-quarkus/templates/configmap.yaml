apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "oyci-quarkus.fullname" . }}
  labels:
    {{- include "oyci-quarkus.labels" . | nindent 4 }}
data:
  # Datasource
  QUARKUS_DATASOURCE_DB_KIND: {{ .Values.datasource.dbKind | quote }}
  QUARKUS_DATASOURCE_JDBC_URL: {{ .Values.datasource.jdbcUrl | quote }}
  QUARKUS_DATASOURCE_JDBC_MAX_SIZE: {{ .Values.datasource.poolMaxSize | quote }}
  QUARKUS_DATASOURCE_JDBC_MIN_SIZE: {{ .Values.datasource.poolMinSize | quote }}
  QUARKUS_HIBERNATE_ORM_SCHEMA_MANAGEMENT_STRATEGY: {{ .Values.datasource.schemaStrategy | quote }}
  # HTTP / CORS
  QUARKUS_HTTP_CORS: "true"
  QUARKUS_HTTP_CORS_ORIGINS: {{ .Values.app.corsOrigins | quote }}
  QUARKUS_HTTP_CORS_METHODS: "GET,POST,PUT,DELETE,OPTIONS"
  QUARKUS_HTTP_CORS_HEADERS: "*"
  QUARKUS_HTTP_CORS_ACCESS_CONTROL_ALLOW_CREDENTIALS: "true"
  # Logging
  QUARKUS_LOG_LEVEL: {{ .Values.app.logLevel | quote }}
  QUARKUS_LOG_CONSOLE_ENABLE: "true"
  # Swagger / OpenAPI
  QUARKUS_SWAGGER_UI_ALWAYS_INCLUDE: {{ .Values.app.swaggerEnabled | quote }}
  QUARKUS_SMALLRYE_OPENAPI_INFO_TITLE: "OYCI API"
  QUARKUS_SMALLRYE_OPENAPI_INFO_VERSION: {{ .Chart.AppVersion | quote }}
  QUARKUS_SMALLRYE_OPENAPI_INFO_DESCRIPTION: "Scottish Tech Army OYCI Quarkus API"
  {{- if .Values.mail.enabled }}
  # Mail
  QUARKUS_MAILER_FROM: {{ .Values.mail.from | quote }}
  QUARKUS_MAILER_HOST: {{ .Values.mail.host | quote }}
  QUARKUS_MAILER_PORT: {{ .Values.mail.port | quote }}
  QUARKUS_MAILER_SSL: {{ .Values.mail.ssl | quote }}
  QUARKUS_MAILER_STARTTLS: {{ .Values.mail.startTls | quote }}
  QUARKUS_MAILER_AUTH_METHODS: {{ .Values.mail.authMethods | quote }}
  {{- end }}

