apiVersion: v1
kind: Secret
metadata:
  name: {{ include "oyci-quarkus.fullname" . }}
  labels:
    {{- include "oyci-quarkus.labels" . | nindent 4 }}
type: Opaque
stringData:
  QUARKUS_DATASOURCE_USERNAME: {{ .Values.dbCredentials.username | quote }}
  QUARKUS_DATASOURCE_PASSWORD: {{ .Values.dbCredentials.password | quote }}
  {{- if .Values.mail.enabled }}
  QUARKUS_MAILER_USERNAME: {{ .Values.mailCredentials.username | quote }}
  QUARKUS_MAILER_PASSWORD: {{ .Values.mailCredentials.password | quote }}
  {{- end }}

