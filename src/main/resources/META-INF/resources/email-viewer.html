<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Email Viewer</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2em; }
        .email { border: 1px solid #ccc; padding: 1em; margin-bottom: 2em; border-radius: 8px; }
        .header { font-weight: bold; margin-bottom: 0.5em; }
        .subject { color: #2a4d8f; font-size: 1.1em; }
        .content { background: #f9f9f9; padding: 1em; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Sent Emails (In-Memory Viewer)</h1>
    <p style="color:#555;max-width:600px;">This viewer displays all emails your app <strong>would send</strong> if real SMTP were enabled. No real emails are sent. <br>Why? Real SMTP is often blocked or requires approval in dev/test environments. This approach is safe and reliable for development.</p>
    <div id="emails"></div>
    <script>
        async function loadEmails() {
            const res = await fetch('/emails');
            const emails = await res.json();
            const container = document.getElementById('emails');
            if (emails.length === 0) {
                container.innerHTML = '<em>No emails sent yet.</em>';
                return;
            }
            container.innerHTML = emails.map(email => `
                <div class="email">
                    <div class="header">From: <span style="color:#2a4d8f;">${email.from || '(none)'}</span></div>
                    <div class="header">To: <span style="color:#2a4d8f;">${email.to && email.to.length ? email.to.join(', ') : '(none)'}</span></div>
                    <div class="subject">Subject: ${email.subject || '(No subject)'}</div>
                    <div class="content">
                        <pre>${email.text || email.body || '(No text content)'}</pre>
                        ${email.html ? `<div><strong>HTML Preview:</strong><br>${email.html}</div>` : ''}
                    </div>
                </div>
            `).join('');
        }
        loadEmails();
    </script>
</body>
</html>
