# =============================================
# Production Profile - application-prod.properties
# =============================================
# Activated automatically when QUARKUS_PROFILE=prod
# or via -Dquarkus.profile=prod
#
# In Kubernetes, the ConfigMap and Secret inject env vars
# that override these defaults (QUARKUS_DATASOURCE_* etc.)
# =============================================

# -----------------------------
# Datasource - PostgreSQL
# -----------------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/oyci}
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:oyci_user}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:changeme}
quarkus.datasource.jdbc.max-size=${QUARKUS_DATASOURCE_JDBC_MAX_SIZE:10}
quarkus.datasource.jdbc.min-size=${QUARKUS_DATASOURCE_JDBC_MIN_SIZE:2}

# Hibernate ORM - never auto-modify schema in production
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.log.sql=false

# -----------------------------
# HTTP / CORS
# -----------------------------
quarkus.http.cors=true
quarkus.http.cors.origins=${QUARKUS_HTTP_CORS_ORIGINS:*}

# -----------------------------
# Swagger / OpenAPI
# -----------------------------
quarkus.swagger-ui.always-include=false

# -----------------------------
# Logging
# -----------------------------
quarkus.log.level=WARN
quarkus.log.category."org.scottishtecharmy.oyci".level=INFO
quarkus.log.console.enable=true
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n
quarkus.log.console.color=false

# -----------------------------
# Health
# -----------------------------
quarkus.smallrye-health.ui.enable=false




