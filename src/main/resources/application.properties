# ===== Datasource =====
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:oyci}
quarkus.datasource.password=${DB_PASSWORD:oyci}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/oyci}

# ===== Flyway =====
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration

# ===== Hibernate ORM =====
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false

# ===== JWT =====
mp.jwt.verify.issuer=${JWT_ISSUER:https://oyci.scottishtecharmy.org}
mp.jwt.verify.publickey.location=publicKey.pem
smallrye.jwt.sign.key.location=privateKey.pem
smallrye.jwt.new-token.issuer=${JWT_ISSUER:https://oyci.scottishtecharmy.org}
smallrye.jwt.new-token.lifespan=86400

# ===== Mailer =====
quarkus.mailer.host=${SMTP_HOST:localhost}
quarkus.mailer.port=${SMTP_PORT:1025}
quarkus.mailer.username=${SMTP_USER:}
quarkus.mailer.password=${SMTP_PASSWORD:}
quarkus.mailer.from=${MAIL_FROM:noreply@oyci.org}
quarkus.mailer.start-tls=OPTIONAL
quarkus.mailer.mock=false

# ===== Dev profile overrides =====
%dev.quarkus.mailer.mock=true
%dev.quarkus.hibernate-orm.log.sql=true

# ===== Test profile overrides =====
%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/oyci
%test.quarkus.datasource.username=oyci
%test.quarkus.datasource.password=oyci
%test.quarkus.flyway.clean-at-start=true
%test.quarkus.mailer.mock=true

# ===== HTTP =====
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.rest.path=/api

